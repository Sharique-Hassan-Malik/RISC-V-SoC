[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socgen"
version = "1.0.0"
description = "A RISC-V SoC, eight hardware modules, and the memory map and build harness that join them"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The generators and the harness are standard library only. The hardware needs
# iverilog, verilator and ghdl, which are not pip-installable.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
soc = "socgen.cli:main"

[tool.setuptools.packages.find]
include = ["socgen*"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
addopts = "-q --import-mode=importlib"
markers = [
    "slow: builds and runs a hardware simulation (minutes, not seconds)",
]
